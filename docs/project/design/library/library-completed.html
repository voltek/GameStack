<script>
        // Micro-interactions for list items
        document.querySelectorAll('.cursor-pointer').forEach(item => {
            item.addEventListener('mouseenter', () => {
                // Potential for adding subtle sound or lighting effect via JS
            });
        });

        // Simple scroll behavior for top bar
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                header.classList.add('bg-surface-container');
                header.classList.remove('bg-surface-container-low');
            } else {
                header.classList.remove('bg-surface-container');
                header.classList.add('bg-surface-container-low');
            }
        });
    </script>
