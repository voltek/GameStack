<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#D0BCFF",
                        "on-primary": "#381E72",
                        "primary-container": "#4F378B",
                        "on-primary-container": "#EADDFF",
                        secondary: "#CCC2DC",
                        "on-secondary": "#332D41",
                        "secondary-container": "#4A4458",
                        "on-secondary-container": "#E8DEF8",
                        surface: "#1C1B1F",
                        "on-surface": "#E6E1E5",
                        "surface-variant": "#49454F",
                        "on-surface-variant": "#CAC4D0",
                        outline: "#938F99",
                        "primary-fixed-dim": "#D0BCFF"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Public Sans"],
                        "display": ["Public Sans"],
                        "body": ["Public Sans"],
                        "label": ["Public Sans"]
                    }
                },
            },
        }
    </script>
<style>
        .shimmer {
            background: linear-gradient(
                90deg,
                rgba(73, 69, 79, 0.4) 25%,
                rgba(147, 143, 153, 0.2) 50%,
                rgba(73, 69, 79, 0.4) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #1C1B1F;
            color: #E6E1E5;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-[15px] flex justify-between items-center px-4 h-16 w-full shadow-none">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="sports_esports">sports_esports</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tight text-xl">GameStack</h1>
</div>
<!-- No Avatar as per prompt -->
<div class="w-10"></div>
</header>
<main class="pt-20 px-4 max-w-3xl mx-auto">
<!-- Search Bar -->
<div class="relative w-full mb-6">
<div class="flex items-center bg-surface-variant/30 rounded-full px-4 h-12 border border-outline/20">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="search">search</span>
<div class="h-4 w-32 shimmer rounded-full opacity-40"></div>
</div>
</div>
<!-- Skeleton Grid -->
<div class="grid grid-cols-2 gap-4 mb-8">
<!-- Skeleton Card 1 -->
<div class="flex flex-col gap-3">
<div class="aspect-[3/4] w-full rounded-2xl shimmer"></div>
<div class="h-4 w-3/4 rounded-full shimmer"></div>
</div>
<!-- Skeleton Card 2 -->
<div class="flex flex-col gap-3">
<div class="aspect-[3/4] w-full rounded-2xl shimmer"></div>
<div class="h-4 w-2/3 rounded-full shimmer"></div>
</div>
<!-- Skeleton Card 3 -->
<div class="flex flex-col gap-3">
<div class="aspect-[3/4] w-full rounded-2xl shimmer"></div>
<div class="h-4 w-4/5 rounded-full shimmer"></div>
</div>
<!-- Skeleton Card 4 -->
<div class="flex flex-col gap-3">
<div class="aspect-[3/4] w-full rounded-2xl shimmer"></div>
<div class="h-4 w-1/2 rounded-full shimmer"></div>
</div>
<!-- Skeleton Card 5 -->
<div class="flex flex-col gap-3">
<div class="aspect-[3/4] w-full rounded-2xl shimmer"></div>
<div class="h-4 w-3/4 rounded-full shimmer"></div>
</div>
<!-- Skeleton Card 6 -->
<div class="flex flex-col gap-3">
<div class="aspect-[3/4] w-full rounded-2xl shimmer"></div>
<div class="h-4 w-2/3 rounded-full shimmer"></div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-2 pb-safe bg-surface/80 backdrop-blur-[15px] z-50 h-20 shadow-none">
<!-- Home -->
<button class="flex flex-col items-center justify-center gap-1 text-on-surface-variant px-5 py-1 hover:bg-surface-variant/20 rounded-full active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-xs font-medium">Home</span>
</button>
<!-- Search (ACTIVE) -->
<button class="flex flex-col items-center justify-center gap-1 bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined" data-icon="search" style="font-variation-settings: 'FILL' 1;">search</span>
<span class="text-xs font-bold">Search</span>
</button>
<!-- Library -->
<button class="flex flex-col items-center justify-center gap-1 text-on-surface-variant px-5 py-1 hover:bg-surface-variant/20 rounded-full active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined" data-icon="library_books">library_books</span>
<span class="text-xs font-medium">Library</span>
</button>
</nav>
<script>
        // Simple logic to handle interactions if needed, though most is CSS
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                // Haptic feedback simulation
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(5);
                }
            });
        });
    </script>
</body></html>
