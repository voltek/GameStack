name: Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  # Superseding a PR run is free; superseding a push to main is not. Every push
  # to main shares one ref, so cancelling there leaves that commit recorded as
  # *cancelled* rather than green — and a green history on main is the point.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: build / test / lint
    runs-on: ubuntu-latest
    # The default is 360. A wedged daemon would bill six hours before anyone looks.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # gradle/gradle-daemon-jvm.properties pins the daemon to Java 21. Anything
      # else makes Gradle download a toolchain on every job.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Robolectric fetches its ~204MB SDK jar at test runtime into ~/.m2, outside
      # Gradle's cache. Restore and save are split on purpose: TOOLING.md § 1.
      - name: Restore the Robolectric SDK jar
        id: robolectric
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric
          # Why both files, and why on one line: TOOLING.md § 1.
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}
          restore-keys: robolectric-${{ runner.os }}-

      # `--continue` reports every independent failure in one run, `--stacktrace`
      # makes a CI-only one traceable. One invocation: Gradle deduplicates the task
      # graph. No IGDB credentials: local.properties falls back to "". The timeout
      # and the GC log per JVM (%p): TOOLING.md § 1.
      - name: Run the gate
        id: gate
        timeout-minutes: 20
        env:
          JAVA_TOOL_OPTIONS: -Xlog:gc,gc+init:file=${{ runner.temp }}/gc-%p.log
        run: ./gradlew build test lint --continue --stacktrace

      - name: Save the Robolectric SDK jar
        # `!cancelled()`, not `always()`: TOOLING.md § 1.
        if: ${{ !cancelled() && steps.robolectric.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.cache-primary-key }}

      # Not `failure()`: whether a timed-out step counts as failed is undocumented.
      - name: Upload reports
        if: ${{ always() && steps.gate.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

      # Every run, a pass included: a passing run is CI's heap baseline.
      - name: Upload GC logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gate-gc-logs
          path: ${{ runner.temp }}/gc-*.log
          retention-days: 7
