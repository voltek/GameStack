name: Commits

# Separate from gate.yml so that a PR title or body edit reruns these, on
# purpose (TOOLING.md § 11), and not Gradle. Covers what no local hook sees:
# the PR title and body, and commits made in a clone without the hooks or on
# the web. It also runs the harness scripts' tests, which need no Gradle.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    # Branch protection requires this exact name (TOOLING.md § 2); the body step runs under it.
    name: messages / title / branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test the rules
        run: sh .githooks/test-rules.sh

      - name: Test the session-start hook
        if: ${{ !cancelled() }}
        run: sh .claude/hooks/test-session-start.sh

      # Node comes from the runner image; the script needs 20.11 or later (import.meta.dirname).
      - name: Test the review extractor
        if: ${{ !cancelled() }}
        run: node .claude/skills/review-round/scripts/test-save-review.mjs

      # The cases fold with --autosquash, which needs git 2.44 or later (clean-branch § Folding).
      - name: Test the reword script
        if: ${{ !cancelled() }}
        run: sh .claude/skills/clean-branch/scripts/test-reword.sh

      # The list is captured first: a failing substitution inside `for` does not
      # stop bash -e, and the loop would check nothing and pass.
      - name: Check every commit on the branch
        if: ${{ !cancelled() }}
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          shas=$(git rev-list "$BASE..$HEAD_SHA") || exit 1
          status=0
          for sha in $shas; do
            echo "Checking $(git log -1 --format='%h %s' "$sha")"
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            merge=
            git rev-parse -q --verify "$sha^2" > /dev/null && merge=merge
            sh .githooks/rules.sh message "$RUNNER_TEMP/message" $merge || status=1
          done
          sh .githooks/rules.sh repeats "$BASE" "$HEAD_SHA" || status=1
          exit $status

      # The title arrives through env, never interpolated into the script: a
      # PR title is text anyone opening a PR controls.
      - name: Check the PR title and the branch name
        if: ${{ !cancelled() }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
        run: |
          status=0
          sh .githooks/rules.sh title "$TITLE" || status=1
          sh .githooks/rules.sh branch "$BRANCH" "$TITLE" || status=1
          exit $status

      # Through env for the same reason as the title.
      - name: Check the PR body
        if: ${{ !cancelled() }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body"
          sh .githooks/rules.sh body "$RUNNER_TEMP/body" "$TITLE"
