name: Pending work
description: Harness and repository work not done yet — tooling, an improvement, an idea, a harness defect (ADR 0038).
body:
  - type: markdown
    attributes:
      value: |
        **Every issue (ADR 0038).** Harness and repository work only: product work uses *Product item*,
        and a defect in the app *App defect* (ADR 0043, ADR 0048).
        One item per issue. **Title in the commit form** of ADR 0034, `type(scope): Imperative summary`
        (`.githooks/rules.sh title "<title>"` checks it): it becomes the title of the pull request that
        closes this issue with `Closes #n`. Labels when it is opened: a bucket, a priority unless `gated`,
        `export` and `gated`; a triage confirms or changes them (ADR 0047). The fields below apply no
        label: an opener who cannot set labels leaves them to the triage, which reads these fields.
        Nothing from the human's separate study programme goes in an issue: this repository is public.
  - type: input
    id: source
    attributes:
      label: Source
      description: A review round (branch and round), the owner (date), or an agent (branch or session).
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing, with its evidence — a file and line, a run id, a measurement.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: A capture that proves the problem, if one does, dragged in here.
  - type: textarea
    id: grounds
    attributes:
      label: Grounds
      description: The rule, ADR or document section it rests on. "None" is an answer, and makes it an idea.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: The likeliest shape. A proposal; the triage and the branch decide.
  - type: textarea
    id: ruled-out
    attributes:
      label: Ruled out
      description: Shapes already rejected, each with its reason — what saves the next attempt a dead end.
  - type: textarea
    id: trigger
    attributes:
      label: Trigger
      description: Only for an item gated on an event — the event, and how to check whether it has fired.
  - type: textarea
    id: lands
    attributes:
      label: Where it lands when shipped
      description: Its rule to CLAUDE.md or `.claude/rules/`, procedure to a Skill, decision to an ADR, a TOOLING.md entry, and the Enforced by line of every ADR it now polices.
  - type: dropdown
    id: bucket
    attributes:
      label: Bucket
      description: The author's proposal; the triage's label is the decision.
      options:
        - blocks-product
        - defect
        - improvement
        - idea
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: The author's proposal, by ADR 0038's meanings; a gated item takes none. The triage's label is the decision.
      options:
        - p1
        - p2
        - p3
        - none (gated)
    validations:
      required: true
  - type: dropdown
    id: export
    attributes:
      label: Export value
      description: Does the outcome change TOOLING.md § Rebuilding this elsewhere?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
